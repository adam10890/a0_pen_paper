<script type="module" src="/plugins/a0_pen_paper/webui/workflows-store.js"></script>

<style>
    [x-cloak] { display: none !important; }

    .pnpwf-panel {
        box-sizing: border-box;
        display: flex !important;
        flex-direction: column;
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        color: var(--color-text);
        font-size: 0.85rem;
        line-height: 1.4;
    }

    .pnpwf-panel * { box-sizing: border-box; }

    .pnpwf-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.65rem 0.9rem;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 58%, transparent);
        background: color-mix(in srgb, var(--color-background) 92%, #000 8%);
    }

    .pnpwf-header h2 {
        margin: 0;
        font-size: 0.82rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }

    .pnpwf-mode-toggle {
        display: inline-flex;
        border-radius: 0.35rem;
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        overflow: hidden;
    }

    .pnpwf-mode-btn {
        font-size: 0.68rem;
        padding: 0.28rem 0.55rem;
        border: none;
        background: transparent;
        color: var(--color-text-muted);
        cursor: pointer;
    }

    .pnpwf-mode-btn.is-active {
        background: color-mix(in srgb, var(--color-highlight) 18%, transparent);
        color: var(--color-text);
    }

    .pnpwf-lang-btn {
        font-size: 0.66rem;
        padding: 0.24rem 0.5rem;
        border-radius: 0.35rem;
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        background: transparent;
        color: var(--color-text-muted);
        cursor: pointer;
    }

    .pnpwf-lang-btn:hover {
        color: var(--color-text);
        border-color: var(--color-highlight);
    }

    .pnpwf-stale-banner {
        flex: 0 0 auto;
        padding: 0.4rem 0.65rem;
        font-size: 0.72rem;
        background: color-mix(in srgb, #c90 18%, transparent);
        border-bottom: 1px solid color-mix(in srgb, #c90 35%, transparent);
    }

    .pnpwf-body {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 11rem 1fr;
        min-height: 0;
        overflow: hidden;
    }

    .pnpwf-sidebar {
        border-right: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: color-mix(in srgb, var(--color-background) 96%, #000 4%);
    }

    .pnpwf-sidebar-actions {
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
    }

    .pnpwf-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 0.35rem;
    }

    .pnpwf-item {
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        color: var(--color-text);
        border-radius: 0.35rem;
        padding: 0.45rem 0.5rem;
        cursor: pointer;
        font-size: 0.78rem;
    }

    .pnpwf-item:hover {
        background: color-mix(in srgb, var(--color-highlight) 12%, transparent);
    }

    .pnpwf-item.is-active {
        border-color: color-mix(in srgb, var(--color-highlight) 40%, transparent);
        background: color-mix(in srgb, var(--color-highlight) 18%, transparent);
    }

    .pnpwf-item.is-chat-current {
        border-color: color-mix(in srgb, var(--color-highlight) 55%, transparent);
    }

    .pnpwf-item.is-chat-focus {
        box-shadow: inset 2px 0 0 var(--color-highlight);
    }

    .pnpwf-badge {
        display: inline-block;
        font-size: 0.6rem;
        padding: 0.1rem 0.35rem;
        margin-left: 0.25rem;
        border-radius: 0.25rem;
        background: color-mix(in srgb, var(--color-highlight) 20%, transparent);
        color: var(--color-text);
        vertical-align: middle;
    }

    .pnpwf-badge.muted {
        background: color-mix(in srgb, var(--color-border) 40%, transparent);
        color: var(--color-text-muted);
    }

    .pnpwf-chat-bar {
        flex: 0 0 auto;
        padding: 0.35rem 0.65rem;
        font-size: 0.68rem;
        color: var(--color-text-muted);
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 35%, transparent);
    }

    .pnpwf-main {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
    }

    .pnpwf-meta {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.4rem;
        padding: 0.5rem 0.65rem;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
    }

    .pnpwf-live-bar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.65rem;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
    }

    .pnpwf-live-bar label,
    .pnpwf-diagram-controls label {
        font-size: 0.68rem;
        color: var(--color-text-muted);
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
    }

    .pnpwf-live-bar select,
    .pnpwf-diagram-controls select {
        font-size: 0.75rem;
        padding: 0.25rem 0.4rem;
        border-radius: 0.3rem;
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        background: var(--color-input-background, var(--color-background));
        color: var(--color-text);
    }

    .pnpwf-diagram-controls {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        padding: 0.45rem 0.65rem;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 35%, transparent);
        background: color-mix(in srgb, var(--color-background) 97%, #000 3%);
    }

    .pnpwf-diagram-preview {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.5rem;
        align-items: start;
        padding: 0.45rem 0.65rem;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 35%, transparent);
        background: color-mix(in srgb, var(--color-background) 94%, #000 6%);
    }

    .pnpwf-diagram-preview pre {
        margin: 0.2rem 0 0;
        max-height: 4.8rem;
        overflow: auto;
        white-space: pre-wrap;
        font: 0.68rem/1.35 ui-monospace, Consolas, monospace;
        color: var(--color-text-muted);
    }

    .pnpwf-diagram-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        justify-content: flex-end;
    }

    .pnpwf-meta label {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        font-size: 0.68rem;
        color: var(--color-text-muted);
    }

    .pnpwf-meta input {
        font-size: 0.78rem;
        padding: 0.35rem 0.45rem;
        border-radius: 0.35rem;
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        background: var(--color-input-background, var(--color-background));
        color: var(--color-text);
    }

    .pnpwf-tabs {
        flex: 0 0 auto;
        display: flex;
        gap: 0.25rem;
        padding: 0.35rem 0.65rem;
        border-bottom: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent);
    }

    .pnpwf-tab {
        font-size: 0.72rem;
        padding: 0.3rem 0.65rem;
        border-radius: 0.35rem;
        border: 1px solid transparent;
        background: transparent;
        color: var(--color-text-muted);
        cursor: pointer;
    }

    .pnpwf-tab.is-active {
        color: var(--color-text);
        border-color: color-mix(in srgb, var(--color-highlight) 35%, transparent);
        background: color-mix(in srgb, var(--color-highlight) 12%, transparent);
    }

    .pnpwf-editor-area {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 0.5rem 0.65rem;
    }

    .pnpwf-editor-area textarea {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        resize: none;
        font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
        font-size: 0.78rem;
        line-height: 1.45;
        padding: 0.55rem;
        border-radius: 0.4rem;
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        background: color-mix(in srgb, var(--color-background) 94%, #000 6%);
        color: var(--color-text);
    }

    .pnpwf-preview {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 0.55rem;
        border-radius: 0.4rem;
        border: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
        font-size: 0.82rem;
    }

    .pnpwf-footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.5rem 0.65rem;
        border-top: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
    }

    .pnpwf-btn {
        font-size: 0.72rem;
        padding: 0.35rem 0.7rem;
        border-radius: 0.35rem;
        border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
        background: color-mix(in srgb, var(--color-background) 90%, #000 10%);
        color: var(--color-text);
        cursor: pointer;
    }

    .pnpwf-btn:hover { border-color: var(--color-highlight); }
    .pnpwf-btn.primary {
        background: color-mix(in srgb, var(--color-highlight) 22%, transparent);
        border-color: color-mix(in srgb, var(--color-highlight) 45%, transparent);
    }

    .pnpwf-hint {
        font-size: 0.68rem;
        color: var(--color-text-muted);
    }

    .pnpwf-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-muted);
        font-size: 0.8rem;
        padding: 1rem;
        text-align: center;
    }
</style>

<div
    class="pnpwf-panel"
    x-data
    x-init="$store.penPaperWorkflows?.init()"
>
    <header class="pnpwf-header">
        <h2>
            <span class="material-symbols-outlined" style="font-size:1.1rem">edit_note</span>
            Workflows
        </h2>
        <div class="pnpwf-mode-toggle">
            <button
                type="button"
                class="pnpwf-mode-btn"
                :class="{ 'is-active': $store.penPaperWorkflows?.mode === 'templates' }"
                @click="$store.penPaperWorkflows.setMode('templates')"
            >Templates</button>
            <button
                type="button"
                class="pnpwf-mode-btn"
                :class="{ 'is-active': $store.penPaperWorkflows?.mode === 'live' }"
                @click="$store.penPaperWorkflows.setMode('live')"
            >Live</button>
        </div>
        <span class="pnpwf-hint" x-text="$store.penPaperWorkflows?.status"></span>
        <span class="pnpwf-hint" style="margin-left:auto" x-show="$store.penPaperWorkflows?.mode === 'templates' && $store.penPaperWorkflows?.dirty">●</span>
        <button
            type="button"
            class="pnpwf-lang-btn"
            @click="$store.penPaperWorkflows.toggleUiLang()"
            x-text="$store.penPaperWorkflows.t('languageButton')"
        ></button>
    </header>

    <div
        class="pnpwf-stale-banner"
        x-show="$store.penPaperWorkflows?.mode === 'live' && $store.penPaperWorkflows?.sessionStale"
        x-cloak
    >
        <span x-text="$store.penPaperWorkflows.t('staleBanner')"></span>
        <button type="button" class="pnpwf-btn" style="margin-left:0.5rem" @click="$store.penPaperWorkflows.loadSessionSection()" x-text="$store.penPaperWorkflows.t('refresh')"></button>
    </div>

    <!-- Templates mode -->
    <div
        class="pnpwf-body"
        x-show="$store.penPaperWorkflows?.mode === 'templates' && $store.penPaperWorkflows?.templates?.length"
    >
        <aside class="pnpwf-sidebar">
            <div class="pnpwf-sidebar-actions">
                <button class="pnpwf-btn primary" type="button" @click="$store.penPaperWorkflows.createNew()" x-text="$store.penPaperWorkflows.t('new')"></button>
                <button class="pnpwf-btn" type="button" @click="$store.penPaperWorkflows.refreshList()">↻</button>
            </div>
            <div class="pnpwf-list">
                <template x-for="t in $store.penPaperWorkflows.templates" :key="t.name">
                    <button
                        type="button"
                        class="pnpwf-item"
                        :class="{ 'is-active': $store.penPaperWorkflows.selected === t.name }"
                        @click="$store.penPaperWorkflows.select(t.name)"
                        x-text="t.name"
                    ></button>
                </template>
            </div>
        </aside>

        <section class="pnpwf-main" x-show="$store.penPaperWorkflows.selected">
            <div class="pnpwf-meta">
                <label><span x-text="$store.penPaperWorkflows.t('description')"></span>
                    <input type="text" x-model="$store.penPaperWorkflows.description" @input="$store.penPaperWorkflows.markDirty()" />
                </label>
                <label><span x-text="$store.penPaperWorkflows.t('descriptionHe')"></span>
                    <input type="text" x-model="$store.penPaperWorkflows.descriptionHe" @input="$store.penPaperWorkflows.markDirty()" />
                </label>
                <label><span x-text="$store.penPaperWorkflows.t('phases')"></span>
                    <input type="text" x-model="$store.penPaperWorkflows.phasesText" @input="$store.penPaperWorkflows.markDirty()" />
                </label>
                <label><span x-text="$store.penPaperWorkflows.t('triggers')"></span>
                    <input type="text" x-model="$store.penPaperWorkflows.triggersText" @input="$store.penPaperWorkflows.markDirty()" />
                </label>
            </div>

            <div class="pnpwf-diagram-controls">
                <label><span x-text="$store.penPaperWorkflows.t('diagram')"></span>
                    <select x-model="$store.penPaperWorkflows.diagramType">
                        <template x-for="d in $store.penPaperWorkflows.diagramTypes" :key="d">
                            <option :value="d" x-text="d"></option>
                        </template>
                    </select>
                </label>
                <label><span x-text="$store.penPaperWorkflows.t('theme')"></span>
                    <select x-model="$store.penPaperWorkflows.diagramTheme">
                        <template x-for="t in $store.penPaperWorkflows.diagramThemes" :key="t">
                            <option :value="t" x-text="t"></option>
                        </template>
                    </select>
                </label>
                <button
                    type="button"
                    class="pnpwf-btn"
                    @click="$store.penPaperWorkflows.generateDiagram()"
                    :disabled="$store.penPaperWorkflows.generatingDiagram"
                >
                    <span class="material-symbols-outlined" style="font-size:1rem;vertical-align:-0.2rem">account_tree</span>
                    <span x-text="$store.penPaperWorkflows.generatingDiagram ? $store.penPaperWorkflows.t('creating') : $store.penPaperWorkflows.t('create')"></span>
                </button>
                <span class="pnpwf-hint" x-show="$store.penPaperWorkflows.diagramPath" x-text="$store.penPaperWorkflows.diagramPath"></span>
            </div>

            <div class="pnpwf-diagram-preview" x-show="$store.penPaperWorkflows.diagramPath" x-cloak>
                <div>
                    <strong class="pnpwf-hint" x-text="$store.penPaperWorkflows.t('diagramPreview')"></strong>
                    <pre x-text="$store.penPaperWorkflows.diagramSketch"></pre>
                </div>
                <div class="pnpwf-diagram-actions">
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.copyDiagramPath()" x-text="$store.penPaperWorkflows.t('copyPath')"></button>
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.downloadDiagram()" x-text="$store.penPaperWorkflows.t('download')"></button>
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.openDrawio()" x-text="$store.penPaperWorkflows.t('openDrawio')"></button>
                    <button
                        type="button"
                        class="pnpwf-btn primary"
                        @click="$store.penPaperWorkflows.sendDiagramToWhiteboard()"
                        :disabled="$store.penPaperWorkflows.sendingWhiteboard"
                    >
                        <span x-text="$store.penPaperWorkflows.sendingWhiteboard ? $store.penPaperWorkflows.t('sendingWhiteboard') : $store.penPaperWorkflows.t('sendWhiteboard')"></span>
                    </button>
                </div>
            </div>

            <div class="pnpwf-tabs">
                <button type="button" class="pnpwf-tab" :class="{ 'is-active': $store.penPaperWorkflows.tab === 'edit' }" @click="$store.penPaperWorkflows.tab = 'edit'" x-text="$store.penPaperWorkflows.t('edit')"></button>
                <button type="button" class="pnpwf-tab" :class="{ 'is-active': $store.penPaperWorkflows.tab === 'preview' }" @click="$store.penPaperWorkflows.tab = 'preview'" x-text="$store.penPaperWorkflows.t('preview')"></button>
            </div>

            <div class="pnpwf-editor-area">
                <textarea
                    x-show="$store.penPaperWorkflows.tab === 'edit'"
                    x-model="$store.penPaperWorkflows.content"
                    @input="$store.penPaperWorkflows.onContentInput()"
                    placeholder="# Workflow markdown..."
                ></textarea>
                <div
                    x-show="$store.penPaperWorkflows.tab === 'preview'"
                    class="pnpwf-preview"
                    x-html="$store.penPaperWorkflows.previewHtml"
                ></div>
            </div>

            <footer class="pnpwf-footer">
                <span class="pnpwf-hint" x-text="'usr/pen_and_paper/knowledge/workflows/' + ($store.penPaperWorkflows.selected || '') + '.md'"></span>
                <div style="display:flex;gap:0.35rem">
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.revert()" :disabled="!$store.penPaperWorkflows.dirty" x-text="$store.penPaperWorkflows.t('revert')"></button>
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.deleteSelected()" x-text="$store.penPaperWorkflows.t('delete')"></button>
                    <button type="button" class="pnpwf-btn primary" @click="$store.penPaperWorkflows.save()" :disabled="$store.penPaperWorkflows.saving || !$store.penPaperWorkflows.dirty">
                        <span x-text="$store.penPaperWorkflows.saving ? $store.penPaperWorkflows.t('saving') : $store.penPaperWorkflows.t('save')"></span>
                    </button>
                </div>
            </footer>
        </section>
    </div>

    <!-- Live session mode -->
    <div
        class="pnpwf-body"
        x-show="$store.penPaperWorkflows?.mode === 'live' && ($store.penPaperWorkflows?.sessions?.length || $store.penPaperWorkflows?.sessionTotalCount > 0)"
    >
        <aside class="pnpwf-sidebar">
            <div class="pnpwf-chat-bar" x-show="$store.penPaperWorkflows?.currentChatId">
                <span x-text="$store.penPaperWorkflows.t('chat')"></span>
                <span x-text="$store.penPaperWorkflows.currentChatId"></span>
            </div>
            <div class="pnpwf-sidebar-actions">
                <button class="pnpwf-btn" type="button" @click="$store.penPaperWorkflows.refreshSessions()">↻</button>
                <label class="pnpwf-hint" style="display:flex;align-items:center;gap:0.3rem">
                    <input type="checkbox" x-model="$store.penPaperWorkflows.followAgent" />
                    <span x-text="$store.penPaperWorkflows.t('followAgent')"></span>
                </label>
                <label class="pnpwf-hint" style="display:flex;align-items:center;gap:0.3rem">
                    <input
                        type="checkbox"
                        x-model="$store.penPaperWorkflows.liveChatOnly"
                        @change="$store.penPaperWorkflows.refreshSessions()"
                    />
                    <span x-text="$store.penPaperWorkflows.t('currentChatOnly')"></span>
                </label>
            </div>
            <div class="pnpwf-list">
                <template x-for="s in $store.penPaperWorkflows.sessions" :key="s.name">
                    <button
                        type="button"
                        class="pnpwf-item"
                        :class="{
                            'is-active': $store.penPaperWorkflows.selectedSession === s.name,
                            'is-chat-current': s.is_current_chat,
                            'is-chat-focus': s.is_chat_focus
                        }"
                        @click="$store.penPaperWorkflows.selectSession(s.name)"
                    >
                        <span x-text="s.name"></span>
                        <span class="pnpwf-badge" x-show="s.is_current_chat" x-text="$store.penPaperWorkflows.t('currentChat')"></span>
                        <span class="pnpwf-badge" x-show="s.is_chat_focus && !s.is_current_chat" x-text="$store.penPaperWorkflows.t('active')"></span>
                        <span class="pnpwf-badge muted" x-show="!s.is_current_chat && s.is_orphan" x-text="$store.penPaperWorkflows.t('untagged')"></span>
                        <span class="pnpwf-hint" x-show="s.template" x-text="' · ' + s.template"></span>
                    </button>
                </template>
            </div>
        </aside>

        <section class="pnpwf-main" x-show="$store.penPaperWorkflows.selectedSession">
            <div class="pnpwf-live-bar">
                <label><span x-text="$store.penPaperWorkflows.t('section')"></span>
                    <select
                        x-model="$store.penPaperWorkflows.selectedSection"
                        @change="$store.penPaperWorkflows.loadSessionSection()"
                    >
                        <option value="findings">findings</option>
                        <option value="results">results</option>
                        <option value="insights">insights</option>
                        <option value="notes">notes</option>
                        <option value="decisions">decisions</option>
                        <option value="backtrack">backtrack</option>
                        <option value="execution_log">execution_log</option>
                    </select>
                </label>
                <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.copySessionText()" x-text="$store.penPaperWorkflows.t('copy')"></button>
                <button
                    type="button"
                    class="pnpwf-btn"
                    x-show="$store.penPaperWorkflows.sessionMetadata?.template"
                    @click="$store.penPaperWorkflows.openTemplateFromSession()"
                    x-text="$store.penPaperWorkflows.t('openTemplate')"
                ></button>
            </div>

            <div class="pnpwf-diagram-controls">
                <label><span x-text="$store.penPaperWorkflows.t('diagram')"></span>
                    <select x-model="$store.penPaperWorkflows.diagramType">
                        <template x-for="d in $store.penPaperWorkflows.diagramTypes" :key="d">
                            <option :value="d" x-text="d"></option>
                        </template>
                    </select>
                </label>
                <label><span x-text="$store.penPaperWorkflows.t('theme')"></span>
                    <select x-model="$store.penPaperWorkflows.diagramTheme">
                        <template x-for="t in $store.penPaperWorkflows.diagramThemes" :key="t">
                            <option :value="t" x-text="t"></option>
                        </template>
                    </select>
                </label>
                <button
                    type="button"
                    class="pnpwf-btn"
                    @click="$store.penPaperWorkflows.generateDiagram()"
                    :disabled="$store.penPaperWorkflows.generatingDiagram"
                >
                    <span class="material-symbols-outlined" style="font-size:1rem;vertical-align:-0.2rem">account_tree</span>
                    <span x-text="$store.penPaperWorkflows.generatingDiagram ? $store.penPaperWorkflows.t('creating') : $store.penPaperWorkflows.t('create')"></span>
                </button>
                <span class="pnpwf-hint" x-show="$store.penPaperWorkflows.diagramPath" x-text="$store.penPaperWorkflows.diagramPath"></span>
            </div>

            <div class="pnpwf-diagram-preview" x-show="$store.penPaperWorkflows.diagramPath" x-cloak>
                <div>
                    <strong class="pnpwf-hint" x-text="$store.penPaperWorkflows.t('diagramPreview')"></strong>
                    <pre x-text="$store.penPaperWorkflows.diagramSketch"></pre>
                </div>
                <div class="pnpwf-diagram-actions">
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.copyDiagramPath()" x-text="$store.penPaperWorkflows.t('copyPath')"></button>
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.downloadDiagram()" x-text="$store.penPaperWorkflows.t('download')"></button>
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.openDrawio()" x-text="$store.penPaperWorkflows.t('openDrawio')"></button>
                    <button
                        type="button"
                        class="pnpwf-btn primary"
                        @click="$store.penPaperWorkflows.sendDiagramToWhiteboard()"
                        :disabled="$store.penPaperWorkflows.sendingWhiteboard"
                    >
                        <span x-text="$store.penPaperWorkflows.sendingWhiteboard ? $store.penPaperWorkflows.t('sendingWhiteboard') : $store.penPaperWorkflows.t('sendWhiteboard')"></span>
                    </button>
                </div>
            </div>

            <div class="pnpwf-tabs">
                <button type="button" class="pnpwf-tab" :class="{ 'is-active': $store.penPaperWorkflows.tab === 'edit' }" @click="$store.penPaperWorkflows.tab = 'edit'" x-text="$store.penPaperWorkflows.t('edit')"></button>
                <button type="button" class="pnpwf-tab" :class="{ 'is-active': $store.penPaperWorkflows.tab === 'preview' }" @click="$store.penPaperWorkflows.tab = 'preview'" x-text="$store.penPaperWorkflows.t('preview')"></button>
            </div>

            <div class="pnpwf-editor-area">
                <textarea
                    x-show="$store.penPaperWorkflows.tab === 'edit'"
                    x-model="$store.penPaperWorkflows.content"
                    @input="$store.penPaperWorkflows.onSessionInput()"
                    placeholder="Session section content (append on save)..."
                ></textarea>
                <div
                    x-show="$store.penPaperWorkflows.tab === 'preview'"
                    class="pnpwf-preview"
                    x-html="$store.penPaperWorkflows.previewHtml"
                ></div>
            </div>

            <footer class="pnpwf-footer">
                <span class="pnpwf-hint" x-text="'usr/pen_and_paper/sessions/active/' + ($store.penPaperWorkflows.selectedSession || '')"></span>
                <div style="display:flex;gap:0.35rem">
                    <button type="button" class="pnpwf-btn" @click="$store.penPaperWorkflows.loadSessionSection()" x-text="$store.penPaperWorkflows.t('refresh')"></button>
                    <button
                        type="button"
                        class="pnpwf-btn primary"
                        @click="$store.penPaperWorkflows.saveSessionNote()"
                        :disabled="$store.penPaperWorkflows.saving || !$store.penPaperWorkflows.content?.trim()"
                    >
                        <span x-text="$store.penPaperWorkflows.saving ? $store.penPaperWorkflows.t('adding') : $store.penPaperWorkflows.t('addToSession')"></span>
                    </button>
                </div>
            </footer>
        </section>
    </div>

    <div
        class="pnpwf-empty"
        x-show="$store.penPaperWorkflows?.mode === 'templates' && !$store.penPaperWorkflows?.templates?.length && !$store.penPaperWorkflows?.loading"
    >
        <span x-text="$store.penPaperWorkflows.t('emptyTemplates')"></span>
    </div>

    <div
        class="pnpwf-empty"
        x-show="$store.penPaperWorkflows?.mode === 'live' && !$store.penPaperWorkflows?.sessions?.length && !$store.penPaperWorkflows?.loading"
    >
        <span x-show="!$store.penPaperWorkflows?.sessionTotalCount" x-text="$store.penPaperWorkflows.t('emptyLiveNone')"></span>
        <span x-show="$store.penPaperWorkflows?.sessionTotalCount && $store.penPaperWorkflows?.liveChatOnly" x-text="$store.penPaperWorkflows.t('emptyLiveChatOnly')"></span>
        <span x-show="$store.penPaperWorkflows?.sessionTotalCount && !$store.penPaperWorkflows?.liveChatOnly" x-text="$store.penPaperWorkflows.t('emptyLive')"></span>
    </div>
</div>
