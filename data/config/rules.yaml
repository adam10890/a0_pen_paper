forbidden_actions:
  - "Don't copy entire documents from Memory - extract only relevant parts"
  - "Don't exceed 300 lines without splitting"
  - "Don't use emojis without text labels"
  - "Don't put critical info in the middle of long documents"
  - "Don't create pages without updating _index.md"
  - "Don't search Memory repeatedly during execution - work from P&P"

ownership_matrix:
  - page_type: "_system/*"
    creator: "System"
    updater: "System"
    deleter: "Never"
  - page_type: "_rules.md"
    creator: "User"
    updater: "User"
    deleter: "User"
  - page_type: "knowledge/user_profile.md"
    creator: "User"
    updater: "User + Agent"
    deleter: "User"
  - page_type: "knowledge/capabilities.md"
    creator: "Auto"
    updater: "Auto + Agent"
    deleter: "Never"
  - page_type: "projects/*/_overview.md"
    creator: "Agent"
    updater: "Agent"
    deleter: "User"
  - page_type: "projects/*/_sitemap.md"
    creator: "Auto"
    updater: "Auto"
    deleter: "Never"
  - page_type: "agents/*.md"
    creator: "User/Agent"
    updater: "User/Agent"
    deleter: "User"
  - page_type: "sessions/active/*"
    creator: "Agent"
    updater: "Agent"
    deleter: "Auto (on complete)"
  - page_type: "sessions/archive/*"
    creator: "System"
    updater: "Never"
    deleter: "Auto (>90 days)"

execution_contract:
  description: "Rules governing workflow step execution and state commit"
  rules:
    - "A step is COMPLETE only after both workflow session state AND pen_paper execution_log are updated"
    - "Never re-run a step whose status is COMPLETED or FAILED in session state"
    - "Terminal output alone is NOT a completion signal â€” state commit must follow"
    - "Step status must be checked against WorkflowStepStatus enum values, not raw strings"
    - "Each step has a unique step_id that survives serialization; use it for idempotency checks"
  enforcement: "code â€” SmartRouterExtension._execute_workflow_steps"
  added_at: "2026-03-06"

