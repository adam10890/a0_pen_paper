# Pen & Paper Rules Configuration
# Converted from Markdown rules to YAML format
# Phase 11.1: Rules Migration

metadata:
  title: "Global Rules for Pen & Paper"
  description: "חוקי כתיבה וניהול דפים במערכת P&P"
  last_updated: "2025-01-26"
  status: "active"
  version: "1.0"

core_principle:
  description: "Memory = הספרייה | P&P = המחברת על השולחן"
  rules:
    - "P&P הוא Workspace, לא Storage"
    - "עובדים רק מול ה-P&P (לא חיפוש חוזר בזיכרון)"
    - "מזקקים מידע מהזיכרון לתוך P&P, לא מעתיקים הכל"

naming_conventions:
  files: "lowercase_with_underscores.md"
  system_files: "תחילית _ (לדוגמה: _index.md)"
  sessions: "YYYY-MM-DD_task_name.md"
  projects: "שם הפרויקט כתיקייה (לדוגמה: projects/agent-zero/)"

structure_rules:
  page_layout:
    template: |
      # 🎯 Page Title
      > One-line summary (CRITICAL - put most important info here!)

      ## 📋 Context & Status
      - Current state
      - Last action

      ## 🧠 Main Content
      (Tables for data, Lists for tasks)

      ## ⚡ Action Items
      1. [ ] Next step
      2. [ ] After that

      ## 📝 Notes
      * Additional context

  critical_rules:
    - "Critical info at TOP or BOTTOM - never in the middle (Lost in the Middle)"
    - "Optimal length: 200-300 lines per document"
    - "Warning at 250 lines - time to clean up"
    - "Mandatory action at 300 lines - split or archive completed sections"
    - "Headers are anchors - logical hierarchy, never skip levels"

formatting_guidelines:
  emojis:
    good: "## 🛠️ Tools (emoji + text)"
    bad: "## 🛠️ (emoji only)"
    usage: "Use sparingly for visual scanning"

  data_formats:
    - type: "Comparisons, structured data"
      format: "Markdown Table"
    - type: "Processes with order"
      format: "Numbered List"
    - type: "Features without order"
      format: "Bullet Points"
    - type: "Code snippets"
      format: "Fenced code blocks with language"
    - type: "Actionable items"
      format: "Checkboxes [ ]"

  links:
    - "Use relative paths: [link](../other/page.md)"
    - "Cross-reference related pages"
    - "Update _index.md when creating new pages"

lifecycle_management:
  session_lifecycle:
    stages:
      - "New Task"
      - "Create: sessions/active/YYYY-MM-DD_task.md"
      - "Work: Update progress in session"
      - "250 lines? → WARNING: Clean up completed steps"
      - "300 lines? → MANDATORY: Archive completed, keep active only"
      - "Task done? → Success pattern? → Propose Adaptation"
      - "Task done? → Move to: sessions/archive/"
      - "After 90 days in archive → Delete (with summary log)"

  persistent_tag:
    format: |
      <!-- @persistent -->
      # Document Title
      ...
    use_cases:
      - "Critical architectural decisions"
      - "Important lessons learned"
      - "Base configurations"

setup_protocol:
  steps:
    - "Open new session file: sessions/active/YYYY-MM-DD_task.md"
    - "Pull from Memories: User preferences → ## Constraints"
    - "Pull from Projects: Current task → # Objective"
    - "Pull from Solutions: Existing recipe? → ## Action Plan"

consolidation_protocol:
  steps:
    - "Learned something new? → Update Solution or create Adaptation"
    - "Task complete? → Update Project file, archive Session"
    - "Critical page? → Tag @persistent"
    - "Pattern identified? → Propose to Adaptations system"

forbidden_actions:
  - "Don't copy entire documents from Memory - extract only relevant parts"
  - "Don't exceed 300 lines without splitting"
  - "Don't use emojis without text labels"
  - "Don't put critical info in the middle of long documents"
  - "Don't create pages without updating _index.md"
  - "Don't search Memory repeatedly during execution - work from P&P"

ownership_matrix:
  - page_type: "_system/*"
    creator: "System"
    updater: "System"
    deleter: "Never"
  - page_type: "_rules.md"
    creator: "User"
    updater: "User"
    deleter: "User"
  - page_type: "knowledge/user_profile.md"
    creator: "User"
    updater: "User + Agent"
    deleter: "User"
  - page_type: "knowledge/capabilities.md"
    creator: "Auto"
    updater: "Auto + Agent"
    deleter: "Never"
  - page_type: "projects/*/_overview.md"
    creator: "Agent"
    updater: "Agent"
    deleter: "User"
  - page_type: "projects/*/_sitemap.md"
    creator: "Auto"
    updater: "Auto"
    deleter: "Never"
  - page_type: "agents/*.md"
    creator: "User/Agent"
    updater: "User/Agent"
    deleter: "User"
  - page_type: "sessions/active/*"
    creator: "Agent"
    updater: "Agent"
    deleter: "Auto (on complete)"
  - page_type: "sessions/archive/*"
    creator: "System"
    updater: "Never"
    deleter: "Auto (>90 days)"

execution_contract:
  description: "Rules governing workflow step execution and state commit"
  rules:
    - "A step is done only after both workspace updates and pen_paper execution_log are updated"
    - "Never re-run a step whose status is done or failed in execution_log"
    - "Terminal output alone is NOT a completion signal — state commit must follow"
    - "Step status must use WorkflowStepStatus values: pending, running, done, failed, skipped"
    - "Each step has a unique step_id that survives serialization; use it for idempotency checks"
  enforcement: "code — pen_paper.py + helpers/workflow_executor.py"
  added_at: "2026-03-06"
  updated_at: "2026-05-27"

references:
  - "Scale AI: Lost in the Middle research"
  - "Anthropic: Effective Context Engineering for AI Agents"
  - "ArXiv: Cognitive Architectures for Language Agents"

