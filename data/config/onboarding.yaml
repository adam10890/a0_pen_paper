# Session lifecycle
session_lifecycle:
  stages:
    - "New Task â†’ Create: sessions/YYYY-MM-DD_task.md"
    - "Work â†’ Update progress in session"
    - "250 lines? â†’ WARNING: Clean up completed steps"
    - "300 lines? â†’ MANDATORY: Archive completed, keep active only"
    - "Task done? â†’ Success pattern? â†’ Propose Adaptation"
    - "Task done? â†’ Move to: sessions/archive/"
    - "After 90 days in archive â†’ Delete (with summary log)"

  setup_protocol:
    - "Open new session file: sessions/YYYY-MM-DD_task.md"
    - "Pull from Memories: User preferences â†’ ## Constraints"
    - "Pull from Projects: Current task â†’ # Objective"
    - "Pull from Solutions: Existing recipe? â†’ ## Action Plan"

  consolidation_protocol:
    - "Learned something new? â†’ Update Solution or create Adaptation"
    - "Task complete? â†’ Update Project file, archive Session"
    - "Critical page? â†’ Tag @persistent"
    - "Pattern identified? â†’ Propose to Adaptations system"

