# Pen & Paper Onboarding System
# Phase 11.3: Automated Onboarding
# Provides automatic instruction manual for new agents

metadata:
  title: "Pen & Paper System Onboarding"
  description: "Automated instruction manual for new agents"
  version: "1.0"
  last_updated: "2025-12-28"

# Core system overview
system_overview:
  name: "Pen & Paper (P&P)"
  purpose: "Workspace system for AI agents - like a physical notebook on the desk"
  principle: "Memory = Library | P&P = Notebook on desk"
  key_concept: "Work from P&P, not from memory searches"

# Essential rules (loaded first)
core_rules:
  - "P&P is Workspace, not Storage - extract relevant info from memory, don't copy everything"
  - "Work only from P&P during execution - no repeated memory searches"
  - "Critical information goes at TOP or BOTTOM - never in middle (Lost in the Middle research)"
  - "Optimal document length: 200-300 lines"
  - "Warning at 250 lines: time to clean up"
  - "Mandatory action at 300 lines: split or archive completed sections"
  - "Headers are anchors - maintain logical hierarchy"

# File structure and organization
file_structure:
  overview: |
    usr/pen_and_paper/
    ├── config/
    │   ├── rules.yaml          # System rules (this file)
    │   ├── templates_index.yaml # Available templates
    │   └── onboarding.yaml      # This onboarding guide
    ├── templates/               # Template files
    │   ├── agent.md            # Agent profile template
    │   └── session.md          # Session template
    ├── sessions/                # Active work sessions
    └── vectors/                 # Vectorized content for search

  naming_conventions:
    files: "lowercase_with_underscores.md"
    system_files: "Prefix with _ (e.g., _index.md)"
    sessions: "YYYY-MM-DD_task_name.md"
    projects: "Project name as directory"

# Session lifecycle
session_lifecycle:
  stages:
    - "New Task → Create: sessions/YYYY-MM-DD_task.md"
    - "Work → Update progress in session"
    - "250 lines? → WARNING: Clean up completed steps"
    - "300 lines? → MANDATORY: Archive completed, keep active only"
    - "Task done? → Success pattern? → Propose Adaptation"
    - "Task done? → Move to: sessions/archive/"
    - "After 90 days in archive → Delete (with summary log)"

  setup_protocol:
    - "Open new session file: sessions/YYYY-MM-DD_task.md"
    - "Pull from Memories: User preferences → ## Constraints"
    - "Pull from Projects: Current task → # Objective"
    - "Pull from Solutions: Existing recipe? → ## Action Plan"

  consolidation_protocol:
    - "Learned something new? → Update Solution or create Adaptation"
    - "Task complete? → Update Project file, archive Session"
    - "Critical page? → Tag @persistent"
    - "Pattern identified? → Propose to Adaptations system"

# Formatting guidelines
formatting:
  page_layout: |
    # 🎯 Page Title
    > One-line summary (CRITICAL - put most important info here!)

    ## 📋 Context & Status
    - Current state
    - Last action

    ## 🧠 Main Content
    (Tables for data, Lists for tasks)

    ## ⚡ Action Items
    1. [ ] Next step
    2. [ ] After that

    ## 📝 Notes
    * Additional context

  data_formats:
    - "Comparisons, structured data → Markdown Table"
    - "Processes with order → Numbered List"
    - "Features without order → Bullet Points"
    - "Code snippets → Fenced code blocks with language"
    - "Actionable items → Checkboxes [ ]"

  emojis:
    good: "## 🛠️ Tools (emoji + text)"
    bad: "## 🛠️ (emoji only)"
    usage: "Use sparingly for visual scanning"

# Template system
templates:
  available:
    - id: "agent"
      name: "Agent Template"
      purpose: "Create new agent profiles"
      file: "templates/agent.md"

    - id: "session"
      name: "Session Template"
      purpose: "Start new work sessions"
      file: "templates/session.md"

  selection_guide:
    - "Creating agent profiles → Use agent.md template"
    - "Starting new tasks → Use session.md template"
    - "Following system structure → Refer to page_layout in rules"

# Integration points
integration:
  with_memory: "Extract relevant info from memory → distill into P&P"
  with_projects: "Update project files when tasks complete"
  with_adaptations: "Propose patterns for the Adaptations system"
  with_workflows: "Use workflow templates for complex tasks"

# Error handling
error_handling:
  common_issues:
    - "Document too long → Split or archive completed sections"
    - "Lost critical info → Check if buried in middle of document"
    - "Repeated memory searches → Work from P&P only"
    - "Inconsistent formatting → Follow formatting guidelines"

  recovery_actions:
    - "Split large documents at 300 lines"
    - "Move critical info to top/bottom"
    - "Archive completed work"
    - "Tag important pages with <!-- @persistent -->"

# Performance tips
performance_tips:
  - "Keep documents focused and concise"
  - "Use clear headers for navigation"
  - "Regular cleanup prevents accumulation"
  - "Cross-reference related pages"
  - "Update index files when creating new pages"

# Quality assurance
quality_checks:
  - "Does the document follow the page layout structure?"
  - "Is critical information at top or bottom?"
  - "Are there any orphaned action items?"
  - "Does the document exceed 300 lines?"
  - "Are all cross-references working?"

# Getting help
help_resources:
  - "rules.yaml - Complete system rules"
  - "templates/ - Template files for common tasks"
  - "Existing sessions - Examples of good P&P usage"
  - "Adaptation system - For proposing improvements"

# Migration notes
migration:
  from: "usr/pen_and_paper/_system/_rules.md"
  to: "usr/pen_and_paper/config/"
  completed_at: "2025-12-28"
  status: "active"

